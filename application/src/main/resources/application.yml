spring:
  application:
    name: lingxi-workbench-application
  datasource:
    url: jdbc:postgresql://localhost:5432/lingxi_dev
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      password: EthRedis@123
server:
  port: 8080

sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false
  extend:
    login-type: user
    exclude-uri:
      - /api/v1/auth/login
      - /error

lingxi:
  chat:
    memory:
      max-rounds: 10
      max-tokens: 12000
    generation-event:
      max-events: 2000
      ttl-hours: 24
  security:
    secret-master-key: YU1xZXA1T21TTkRlQVl4TkU2Zm5YSGRHd3dINzhVcjQ=
  mcp:
    security:
      # 私网和本机地址默认拒绝；开发环境只显式开放本机 MCP Server。
      allowed-private-hosts: ${LINGXI_MCP_ALLOWED_PRIVATE_HOSTS:localhost,127.0.0.1,::1}
