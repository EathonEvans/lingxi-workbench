spring:
  application:
    name: lingxi-workbench-application
  datasource:
    url: ${LINGXI_DB_URL:jdbc:postgresql://192.168.86.2:5432/lingxi_dev}
    username: ${LINGXI_DB_USERNAME:postgres}
    password: ${LINGXI_DB_PASSWORD:postgres}
  data:
    redis:
      host: ${LINGXI_REDIS_HOST:192.168.86.2}
      port: ${LINGXI_REDIS_PORT:6379}
      password: ${LINGXI_REDIS_PASSWORD:EthRedis@123}
  ai:
    chat:
      observations:
        # Prompt、补全和工具参数可能包含用户隐私，默认禁止写入观测后端。
        log-prompt: false
        log-completion: false
        include-error-logging: false
server:
  port: 8080

management:
  tracing:
    sampling:
      probability: ${LINGXI_TRACING_SAMPLE_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${LINGXI_TRACING_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Langfuse 使用 HTTP OTLP traces 端点；认证信息只允许通过环境变量注入。
          endpoint: ${LINGXI_TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          headers:
            Authorization: ${LINGXI_TRACING_OTLP_AUTHORIZATION:}
            x-langfuse-ingestion-version: ${LINGXI_LANGFUSE_INGESTION_VERSION:4}
          transport: http
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
  otlp:
    metrics:
      export:
        # Langfuse只接收Trace，关闭Starter默认的OTLP Metrics导出。
        enabled: false

sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false
  extend:
    login-type: user
    exclude-uri:
      - /api/v1/auth/login
      - /internal/v1/conversation-ops/**
      - /internal/v1/intent-routing/**
      - /error

lingxi:
  intent-evaluation:
    enabled: ${LINGXI_INTENT_EVALUATION_ENABLED:false}
    base-url: ${LINGXI_APPLICATION_BASE_URL:http://127.0.0.1:8080}
    token: ${LINGXI_INTERNAL_OPS_TOKEN:YU1xZXA1T21TTkRlQVl4TkU2Zm5YSGRHd3dINzhVcjQ}
    timeout: ${LINGXI_INTENT_EVALUATION_TIMEOUT:60s}
  file:
    url-expire-hours: ${LINGXI_FILE_URL_EXPIRE_HOURS:1}
  storage:
    type: ${LINGXI_STORAGE_TYPE:minio}
    minio:
      endpoint: ${LINGXI_STORAGE_MINIO_ENDPOINT:http://192.168.86.2:9000}
      access-key: ${LINGXI_STORAGE_MINIO_ACCESS_KEY:lingxi}
      secret-key: ${LINGXI_STORAGE_MINIO_SECRET_KEY:lingxi-minio-dev}
      bucket: ${LINGXI_STORAGE_MINIO_BUCKET:lingxi-knowledge}
    oss:
      endpoint: ${LINGXI_STORAGE_OSS_ENDPOINT:}
      access-key-id: ${LINGXI_STORAGE_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${LINGXI_STORAGE_OSS_ACCESS_KEY_SECRET:}
      bucket: ${LINGXI_STORAGE_OSS_BUCKET:}
  chat:
    memory:
      max-rounds: 10
      max-tokens: 12000
    generation-event:
      max-events: 2000
      ttl-hours: 24
    ops:
      enabled: ${LINGXI_CHAT_OPS_ENABLED:true}
      token: ${LINGXI_INTERNAL_OPS_TOKEN:}
      stale-after: ${LINGXI_CHAT_STALE_AFTER:10m}
      memory-delay: ${LINGXI_CHAT_MEMORY_RECONCILE_DELAY:2m}
      reconcile-delay: ${LINGXI_CHAT_RECONCILE_DELAY:1m}
      batch-size: ${LINGXI_CHAT_RECONCILE_BATCH_SIZE:100}
  runtime:
    reconciliation:
      enabled: ${LINGXI_RUNTIME_RECONCILIATION_ENABLED:true}
      delay: ${LINGXI_RUNTIME_RECONCILIATION_DELAY:1m}
      retry-delay: ${LINGXI_RUNTIME_RECONCILIATION_RETRY_DELAY:1m}
      claim-lease: ${LINGXI_RUNTIME_RECONCILIATION_CLAIM_LEASE:30s}
      max-attempts: ${LINGXI_RUNTIME_RECONCILIATION_MAX_ATTEMPTS:3}
      batch-size: ${LINGXI_RUNTIME_RECONCILIATION_BATCH_SIZE:50}
  hitl:
    expiry-scan-delay-ms: ${LINGXI_HITL_EXPIRY_SCAN_DELAY_MS:60000}
    checkpoint-protocol-initial-delay-ms: ${LINGXI_HITL_CHECKPOINT_PROTOCOL_INITIAL_DELAY_MS:1000}
    checkpoint-protocol-scan-delay-ms: ${LINGXI_HITL_CHECKPOINT_PROTOCOL_SCAN_DELAY_MS:60000}
  security:
    # 敏感配置（MCP Token、模型 API Key）加密主密钥，必须由部署环境提供，
    # 缺失时服务启动失败；生成方式：openssl rand -base64 32
    secret-master-key: ${LINGXI_SECRET_MASTER_KEY:YU1xZXA1T21TTkRlQVl4TkU2Zm5YSGRHd3dINzhVcjQ=}
    login-protection:
      # 窗口内连续登录失败达到阈值后临时锁定账号，防止口令爆破
      max-failures: ${LINGXI_LOGIN_MAX_FAILURES:5}
      failure-window: ${LINGXI_LOGIN_FAILURE_WINDOW:10m}
      lock-duration: ${LINGXI_LOGIN_LOCK_DURATION:10m}
  mcp:
    security:
      # 私网和本机地址默认拒绝；开发环境只显式开放本机 MCP Server。
      allowed-private-hosts: ${LINGXI_MCP_ALLOWED_PRIVATE_HOSTS:localhost,127.0.0.1,::1}
  model:
    security:
      # 模型/Embedding 地址默认拒绝私网与本机；本地或内网部署模型时在此显式放行对应主机。
      allowed-private-hosts: ${LINGXI_MODEL_ALLOWED_PRIVATE_HOSTS:localhost,127.0.0.1,::1}

rocketmq:
  name-server: ${LINGXI_ROCKETMQ_NAMESRV:192.168.86.2:9876}
  producer:
    group: lingxi-application-conversation-tx-producer
