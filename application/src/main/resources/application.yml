spring:
  application:
    name: lingxi-workbench-application
  datasource:
    url: ${LINGXI_DB_URL:jdbc:postgresql://localhost:5432/lingxi_dev}
    username: ${LINGXI_DB_USERNAME:postgres}
    password: ${LINGXI_DB_PASSWORD:postgres}
  data:
    redis:
      host: ${LINGXI_REDIS_HOST:localhost}
      port: ${LINGXI_REDIS_PORT:6379}
      password: ${LINGXI_REDIS_PASSWORD:}
  ai:
    model:
      chat: openai
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: ${DEEPSEEK_TEMPERATURE:0.7}
server:
  port: ${LINGXI_APPLICATION_PORT:8080}

sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false
  extend:
    login-type: user
    exclude-uri:
      - /api/v1/auth/login
      - /error
