server:
  port: ${LINGXI_ADMIN_PORT:8801}

spring:
  application:
    name: lingxi-workbench-admin
  datasource:
    url: jdbc:postgresql://localhost:5432/lingxi_dev
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      password: EthRedis@123
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  token-style: random-128
  is-log: false
  is-print: false
  extend:
    login-type: admin
    exclude-uri:
      - /api/v1/auth/login
      - /error
