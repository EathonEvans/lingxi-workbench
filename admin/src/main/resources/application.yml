server:
  port: ${LINGXI_ADMIN_PORT:8801}

spring:
  application:
    name: lingxi-workbench-admin
  datasource:
    url: ${LINGXI_DB_URL:jdbc:postgresql://localhost:5432/lingxi_dev}
    username: ${LINGXI_DB_USERNAME:postgres}
    password: ${LINGXI_DB_PASSWORD:postgres}
  data:
    redis:
      host: ${LINGXI_REDIS_HOST:localhost}
      port: ${LINGXI_REDIS_PORT:6379}
      password: ${LINGXI_REDIS_PASSWORD:EthRedis@123}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  token-style: random-128
  is-log: false
  is-print: false
  extend:
    login-type: admin
    exclude-uri:
      - /api/v1/auth/login
      - /error

lingxi:
  security:
    secret-master-key: YU1xZXA1T21TTkRlQVl4TkU2Zm5YSGRHd3dINzhVcjQ=
  file:
    max-size: ${LINGXI_FILE_MAX_SIZE:10485760}
    url-expire-hours: ${LINGXI_FILE_URL_EXPIRE_HOURS:1}
  storage:
    minio:
      endpoint: ${LINGXI_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${LINGXI_STORAGE_MINIO_ACCESS_KEY:lingxi}
      secret-key: ${LINGXI_STORAGE_MINIO_SECRET_KEY:lingxi-minio-dev}
      bucket: ${LINGXI_STORAGE_MINIO_BUCKET:lingxi-knowledge}
    oss:
      endpoint:
      access-key-id:
      access-key-secret: 
      bucket:
    parsing:
      max-file-size: 20971520
      max-characters: 2000000


rocketmq:
  name-server: ${LINGXI_ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: lingxi-admin-producer
