server:
  port: ${LINGXI_ADMIN_PORT:8801}

spring:
  application:
    name: lingxi-workbench-admin
  datasource:
    url: ${LINGXI_DB_URL:jdbc:postgresql://localhost:5432/lingxi_dev}
    username: ${LINGXI_DB_USERNAME:postgres}
    password: ${LINGXI_DB_PASSWORD:postgres}
  data:
    redis:
      host: ${LINGXI_REDIS_HOST:localhost}
      port: ${LINGXI_REDIS_PORT:6379}
      password: ${LINGXI_REDIS_PASSWORD:EthRedis@123}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  token-style: random-128
  is-log: false
  is-print: false
  extend:
    login-type: admin
    exclude-uri:
      - /api/v1/auth/login
      - /error

lingxi:
  security:
    secret-master-key: YU1xZXA1T21TTkRlQVl4TkU2Zm5YSGRHd3dINzhVcjQ=
  knowledge:
    storage:
      endpoint: ${LINGXI_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${LINGXI_MINIO_ACCESS_KEY:lingxi}
      secret-key: ${LINGXI_MINIO_SECRET_KEY:lingxi-minio-dev}
      bucket: ${LINGXI_MINIO_BUCKET:lingxi-knowledge}
    parsing:
      max-file-size: 20971520
      max-characters: 2000000
    chunking:
      strategy: PARAGRAPH
      chunk-size: 600
      chunk-overlap: 80
